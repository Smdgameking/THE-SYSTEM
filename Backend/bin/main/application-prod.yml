spring:
  config:
    activate:
      on-profile: "prod"

  datasource:
    url: jdbc:postgresql://localhost:5432/thesystem
    username: ${THE_SYSTEM_DB_USERNAME:thesystem}
    password: ${THE_SYSTEM_DB_PASSWORD:mknic123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 9000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.thesystem: INFO
    org.springframework: WARN
    org.hibernate: WARN

thesystem:
  jwt:
    secret: ${THE_SYSTEM_JWT_SECRET}
    access-token-expiration-ms: ${THE_SYSTEM_JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${THE_SYSTEM_JWT_REFRESH_EXPIRATION:604800000}
