version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: thesystem-postgres
    environment:
      POSTGRES_DB: thesystem
      POSTGRES_USER: thesystem
      POSTGRES_PASSWORD: thesystem
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesystem -d thesystem"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thesystem

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thesystem-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thesystem
      SPRING_DATASOURCE_USERNAME: thesystem
      SPRING_DATASOURCE_PASSWORD: thesystem
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/thesystem
      SPRING_FLYWAY_USER: thesystem
      SPRING_FLYWAY_PASSWORD: thesystem
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thesystem

volumes:
  postgres-data:

networks:
  thesystem:
    driver: bridge
