spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/thesystem}
    username: ${DATABASE_USERNAME:thesystem}
    password: ${DATABASE_PASSWORD:mknic123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 9000
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.thesystem: ${LOG_LEVEL_COM_THESYSTEM:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}

thesystem:
  jwt:
    secret: ${THE_SYSTEM_JWT_SECRET:}
    access-token-expiration-ms: ${THE_SYSTEM_JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${THE_SYSTEM_JWT_REFRESH_EXPIRATION:604800000}
